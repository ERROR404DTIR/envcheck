[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envcheck"
version = "1.0.0"
description = "Compare your .env against .env.example"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
envcheck = "envcheck:main"

[tool.setuptools]
py-modules = ["envcheck"]
