<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="envcheck terminal animation">
  <rect width="800" height="220" rx="14" fill="#0d1117"/>
  <rect width="800" height="34" rx="14" fill="#161b22"/>
  <rect y="20" width="800" height="14" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="6" fill="#27c93f"/>
  <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18">
    <text x="28" y="68" fill="#8b949e">$ <tspan fill="#e6edf3">envcheck --strict</tspan></text>
    <text x="28" y="108" fill="#3fb950">
      ✔ DATABASE_URL
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.16;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="136" fill="#f85149">
      ✘ API_KEY        missing
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.30;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="164" fill="#d29922">
      ! SECRET_TOKEN   empty
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="196" fill="#58a6ff">
      + DEBUG_LEGACY   not in .env.example
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.58;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <rect x="262" y="52" width="10" height="20" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
