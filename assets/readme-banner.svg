<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Envcheck</title><desc id="d">Environment configuration keys are checked for missing and empty values.</desc><defs><linearGradient id="bg"><stop stop-color="#172a3d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="100" y="78" width="1000" height="160" rx="12" fill="#0c1929" stroke="#3b536d" stroke-width="2"/><g fill="#edf3ff" font-family="monospace" font-size="17"><text x="145" y="125">API_KEY</text><text x="145" y="170">DATABASE_URL</text><text x="145" y="215">DEBUG</text></g><g fill="#62e3c1" font-family="monospace" font-size="15"><text x="490" y="125">OK</text><text x="490" y="170">OK</text><text x="490" y="215">MISSING</text></g><path d="M700 115H1020M700 160H1020M700 205H1020" stroke="#263c53" stroke-width="3"/><path d="M700 205H870" stroke="#ffc77a" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 170;170 0" dur="3s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">ENVCHECK</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">CONFIG / DIFF / VALIDATE</text></svg>